    <circle cx="125" cy="288" r="4"/>
    <circle cx="205" cy="266" r="4"/>
    <circle cx="285" cy="262" r="4"/>
    <circle cx="365" cy="247" r="4"/>
    <circle cx="445" cy="231" r="4"/>
    <circle cx="525" cy="219" r="4"/>
