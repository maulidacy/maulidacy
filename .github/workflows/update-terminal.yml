name: Update GitHub Activity

on:
  # Bisa dijalankan manual dari tab Actions
  workflow_dispatch:

  # Update otomatis setiap 6 jam
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  update-terminal:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate GitHub activity SVG
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: maulidacy
        run: python scripts/generate_terminal.py

      - name: Commit updated SVG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/github-terminal.svg

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update GitHub activity"
            git push
          fi
